services:
  app:
    build: ./app
    networks:
      - webserver

  nginx:
    image: nginx:alpine
    ports:
      - "8880:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./static:/usr/share/nginx/html
    depends_on:
      - app
    networks:
      - webserver

networks:
  webserver: