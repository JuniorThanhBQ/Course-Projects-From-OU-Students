<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Server</title>
</head>
<body>
    <h1>Xin chào bạn!</h1>
    <p>Chúng tôi là nhóm 5</p>
    <p>Build Timestamp: <span id="build-time"></span></p>
    <script>
        document.getElementById("build-time").textContent = new Date().toLocaleString();

        function displayTime(event) {
            const timeElement = document.getElementById("time");
            timeElement.textContent = event.timeStamp;
        }

        document.body.addEventListener("keypress", displayTime);
    </script>    
</body>
</html>
